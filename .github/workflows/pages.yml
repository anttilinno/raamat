name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Install mdBook
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin mdbook

      - name: Assemble the book
        run: |
          mkdir -p src
          # source file | slug | sidebar title. Order here is the order in the book.
          while IFS='|' read -r file slug title; do
            [ -z "$file" ] && continue
            # Obsidian bits mdBook does not know: [[wikilink]] -> plain text,
            # "> [!note] Pealkiri" callout marker -> a bold heading line.
            sed -E 's/\[\[[^]|]*\|([^]]*)\]\]/\1/g; s/\[\[([^]]*)\]\]/\1/g; s/^> \[!([a-zA-Z]+)\][-+]? ?(.*)$/> **\2**/' \
              "$file.md" > "src/$slug.md"
            printf '%s\n' "$file|$slug|$title" >> /tmp/chapters
          done <<'LIST'
          Juhan Taht|ulevaade|Ülevaade
          Vaatus 0 - Enne porgandit|vaatus-0|0 — Enne porgandit
          Vaatus I - Taht süttib|vaatus-1|I — Taht süttib
          Vaatus II - Blingimine ja varustamine|vaatus-2|II — Blingimine
          Vaatus III - Peipsi arveteklaarimine|vaatus-3|III — Peipsi
          Epiloog - Viies kirjapanek|epiloog|Epiloog
          Tegelased|tegelased|Tegelased
          Juhan Taht - paritolu|paritolu|Päritolu
          Toon ja viited|toon|Toon ja viited
          Johann_Taht_Notes|toormarkmed|Toormärkmed
          LIST

          {
            echo '# Summary'
            echo
            head -1 /tmp/chapters | while IFS='|' read -r file slug title; do
              echo "[$title]($slug.md)"
            done
            echo
            tail -n +2 /tmp/chapters | while IFS='|' read -r file slug title; do
              echo "- [$title]($slug.md)"
            done
          } > src/SUMMARY.md

          cat > book.toml <<'TOML'
          [book]
          title = "Juhan Taht"
          description = "Metsavenna ballaad kolmes vaatuses, ühe hobuse ja kolmeharulise porgandiga."
          language = "et"
          src = "src"

          [output.html]
          default-theme = "ayu"
          preferred-dark-theme = "ayu"
          no-section-label = true
          TOML

          mdbook build -d _site

      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
