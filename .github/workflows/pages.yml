name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Render the book
        run: |
          mkdir _site
          # Obsidian bits pandoc does not know: [[wikilink]] -> plain text,
          # "> [!note]" callout marker -> a bold Note line.
          sed -E 's/\[\[([^]|]*)\|?[^]]*\]\]/\1/g; s/^> \[!([a-zA-Z]+)\][-+]? ?/> **\U\1\E** /' \
            "Johann Taht.md" \
            "Vaatus 0 - Enne porgandit.md" \
            "Vaatus I - Taht süttib.md" \
            "Vaatus II - Blingimine ja varustamine.md" \
            "Vaatus III - Peipsi arveteklaarimine.md" \
            "Epiloog - Neljas kirjapanek.md" \
            "Tegelased.md" \
            "Johann Taht - paritolu.md" \
            "Toon ja viited.md" \
            "Johann_Taht_Notes.md" \
          | pandoc --from=gfm --to=html5 --standalone --toc --embed-resources \
              --metadata title="Johann Taht" --metadata lang=et \
              --output _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
